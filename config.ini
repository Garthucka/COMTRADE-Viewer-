# COMTRADE Viewer & Analyzer - Файл конфигурации
# Configuration file for analysis parameters

[DEFAULT_PARAMETERS]
# Частота дискретизации по умолчанию (Гц)
sampling_rate = 4800

# Пороги для определения моментов (мм)
contact_threshold = 1.0
release_threshold = 0.5

# Параметры анализа вибраций
vibration_window_size = 50
vibration_min_distance = 10

# Стандартные диапазоны для высоковольтных выключателей
[HV_BREAKER_STANDARDS]
# 110-220 кВ выключатели

# Полный ход контакта (мм)
s_full_min = 90
s_full_nominal = 105
s_full_max = 115

# Скорость движения (мм/с)
s_avg_speed_min = 1500
s_avg_speed_nominal = 3000
s_avg_speed_max = 5000

# Перелет (мм)
s_overtravel_min = 1
s_overtravel_nominal = 5
s_overtravel_max = 15

# Отскок (мм)
s_rebound_min = 0
s_rebound_nominal = 1.0
s_rebound_max = 3

# Вибрации (мм)
s_vibr_min = 0
s_vibr_nominal = 1.0
s_vibr_max = 5

# Время срабатывания (мс)
p_switch_dur_min = 50
p_switch_dur_nominal = 65
p_switch_dur_max = 100

# Синхронизация фаз (мс)
p_desync_min = -3
p_desync_nominal = 0
p_desync_max = 3

[GUI_SETTINGS]
# Размеры окна
window_width = 1400
window_height = 900

# Ширина колонн для таблиц
column_width = 150

# Стиль графика
graph_line_width = 1.5
graph_grid_alpha = 0.3

# Цвета по умолчанию
graph_color = blue
graph_background = white

[EXPORT_SETTINGS]
# Формат экспорта отчетов
report_format = text
export_directory = ./reports/

# Шаблоны для экспорта
include_device_info = true
include_channel_info = true
include_raw_data = false
include_graphs = false

[LOGGING]
# Уровень логирования (DEBUG, INFO, WARNING, ERROR)
log_level = INFO

# Сохранение логов в файл
log_to_file = true
log_file = comtrade_viewer.log

# Максимальный размер логов (МБ)
log_max_size = 10

[ANALYSIS_PRESETS]
# Готовые наборы параметров анализа

[PRESET_QUICK]
# Быстрый анализ
name = Быстрый анализ
contact_threshold = 1.0
vibration_window_size = 50

[PRESET_DETAILED]
# Детальный анализ
name = Детальный анализ
contact_threshold = 0.5
vibration_window_size = 100

[PRESET_RESEARCH]
# Научный анализ
name = Научный анализ
contact_threshold = 0.2
vibration_window_size = 200

[COMTRADE_SETTINGS]
# Поддержка COMTRADE стандартов
# 1991 - IEC 255-3 (1991)
# 1999 - IEC 60255-120 (1999)
supported_versions = 1991, 1999

# Форматы данных
supported_formats = 16bit_signed, 32bit_signed

# Поддержка каналов
support_analog = true
support_digital = true

[DATABASE]
# Параметры базы данных (если используется)
enabled = false
type = sqlite3
path = ./measurements.db

# Параметры подключения для других БД
# PostgreSQL
# host = localhost
# port = 5432
# user = analyst
# password = 
# database = comtrade_data

[NOTIFICATIONS]
# Уведомления об аномалиях
enabled = true

# Пороги для предупреждений
warn_speed_low = 1.5
warn_speed_high = 5.0
warn_overtravel_excessive = 15
warn_rebound_excessive = 3
warn_vibration_excessive = 5
warn_desync = 5

# Тип уведомления: message, email, log
notification_type = message

[PLUGINS]
# Включение/отключение плагинов
enabled = false
plugin_directory = ./plugins/

[ABOUT]
version = 1.0
author = COMTRADE Analysis Team
license = Commercial
build_date = 2024-12-11

# Примечание: Этот файл конфигурации может быть расширен
# по мере развития приложения. Неиспользуемые параметры
# игнорируются при загрузке.
